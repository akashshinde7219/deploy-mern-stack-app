version: "3.8"

services:
  backend:
    image: 730335595521.dkr.ecr.ap-south-1.amazonaws.com/devops/mern-app:backend
    ports:
      - "5050:5050"
    networks:
      - mern_network
    environment:
      MONGO_URI: mongodb://mongodb:27017/mydatabase

  frontend:
    image: 730335595521.dkr.ecr.ap-south-1.amazonaws.com/devops/mern-app:frontend
    ports:
      - "5173:5173"
    networks:
      - mern_network
    environment:
      REACT_APP_API_URL: http://backend:5050

  mongodb:
    image: 730335595521.dkr.ecr.ap-south-1.amazonaws.com/devops/mern-app:mongo
    ports:
      - "27017:27017"
    networks:
      - mern_network
    volumes:
      - mongo-data:/data/db

networks:
  mern_network:
    driver: overlay

volumes:
  mongo-data:
    driver: local
